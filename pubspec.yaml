name: party_app
description: Party organization app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.18.0
  
  google_fonts: ^6.1.0
  flutter_staggered_animations: ^1.1.0
  
  floor: ^1.4.2
  sqflite: ^2.3.0
  
  flutter_map: ^6.1.0
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  latlong2: ^0.9.0
  
  image_picker: ^1.0.5
  path_provider: ^2.1.1
  path: ^1.9.0
  
  provider: ^6.1.1
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  floor_generator: ^1.4.2
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
